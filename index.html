<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>அருளின் எழுத்துக்கள்</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.8;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            color: #1a365d;
            text-align: center;
            font-size: 2.2em;
            margin-bottom: 25px;
            border-bottom: 3px solid #3182ce;
            padding-bottom: 10px;
        }
        h2 {
            color: #2b6cb0;
            font-size: 1.6em;
            margin-top: 20px;
            margin-bottom: 5px;
        }
        .author {
            font-weight: bold;
            color: #4a5568;
            font-size: 1.1em;
            margin-bottom: 25px;
        }
        p {
            font-size: 1.1em;
            text-align: justify;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>அருளின் எழுத்துக்கள்</h1>
        
        <h2>சென்னையை நோக்கி என் முதல் பயணம்</h2>
        <div class="author">- ம. அருள்செல்வன்</div>

        <p>உங்கள் பயணக் கட்டுரை அல்லது பதிவின் விவரங்களை இந்த இடத்தில் எழுதலாம்...</p>
    </div>

</body>
</html>
