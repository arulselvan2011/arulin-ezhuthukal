<div class="container">

    <!-- ================= HEADER ================= -->

    <header class="header">

        <h1 class="site-title">
            அருளின் எழுத்துக்கள்
        </h1>

        <h2 class="story-title">
            சென்னையை நோக்கி என் முதல் பயணம்
        </h2>

        <div class="author">
            — ம. அருள் செல்வன்
        </div>

        <div class="divider"></div>

    </header>


    <!-- ================= HOME PAGE ================= -->

        <div id="sectionsList" class="sections">

            <div
                class="section-card"
                onclick="openFirstPDF()"
            >

                <div class="pdf-icon">
                    📄
                </div>

                <div class="section-info">

                    <div class="section-name">
                        முதல் இரண்டு பக்கங்கள்
                    </div>

                    <div class="section-type">
                        PDF • 2 பக்கங்கள்

                </div>

                <div class="arrow">
                    ›
                </div>

            </div>

        </div>


        <div id="emptyMessage" class="empty">

        </div>


        <!-- ADD NEW SECTION -->

        <button
            class="add-button"
            onclick="showAddPage()"
        >
            ＋ புதிய பகுதியைச் சேர்க்க
        </button>

    </section>


    <!-- ================= ADD PAGE ================= -->

    <section
        id="addPage"
        class="page hidden"
    >

        <button
            class="back-button"
            onclick="goHome()"
        >
            ← பின்னால் செல்ல
        </button>


        <div class="form-box">

            <h2 class="form-title">
                புதிய பகுதியைச் சேர்க்க
            </h2>


            <label for="sectionName">
                பகுதியின் பெயர்
            </label>

            <input
                id="sectionName"
                type="text"
                placeholder="உதாரணம்: அடுத்த இரண்டு பக்கங்கள்"
            >


            <label>
                PDF-ஐத் தேர்வு செய்யவும்
            </label>

                class="save-button"
                onclick="savePDFSection()"
            >
                💾 PDF-ஐ சேமிக்கவும்
            </button>

        </div>

    </section>

    <section
        id="viewerPage"
        class="page hidden"
    >

        <button
            class="back-button"
            onclick="goHome()"
        >
            ← பின்னால் செல்ல
        </button>

</div>


<script>

/* =====================================================
   DATABASE
   ===================================================== */

const DB_NAME = "ArulinEzhuthukalDB";
const STORE_NAME = "pdfSections";
const DB_VERSION = 1;


/* =====================================================
   OPEN DATABASE
   ===================================================== */

function openDatabase(){

    return new Promise((resolve,reject)=>{

        const request =
            indexedDB.open(DB_NAME,DB_VERSION);


        request.onupgradeneeded = function(event){

            const db = event.target.result;

            if(!db.objectStoreNames.contains(STORE_NAME)){

                db.createObjectStore(
                    STORE_NAME,
                    {
                        keyPath:"id",
                        autoIncrement:true
                    }
                );

            }

        };


        request.onsuccess = function(){

            resolve(request.result);

        };


        request.onerror = function(){

            reject(request.error);

        };

    });

}


/* =====================================================
   SAVE PDF
   ===================================================== */

async function savePDFSection(){

    const name =
        document.getElementById("sectionName")
        .value
        .trim();

    const fileInput =
        document.getElementById("pdfFile");

    const file =
        fileInput.files[0];


    if(!name){

        alert("முதலில் பகுதியின் பெயரை எழுதுங்கள்.");

        return;
    }


    if(!file){

        alert("முதலில் PDF-ஐத் தேர்வு செய்யுங்கள்.");

        return;
    }


    if(
        file.type !== "application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")
    ){

        alert("PDF file மட்டும் தேர்வு செய்யுங்கள்.");

        return;
    }


    try{

        const db =
            await openDatabase();


        const transaction =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );


        const store =
            transaction.objectStore(STORE_NAME);


        store.add({

            name:name,

            file:file,

            createdAt:new Date().toISOString()

        });


        transaction.oncomplete = function(){

            alert(
                "PDF வெற்றிகரமாக சேமிக்கப்பட்டது!"
            );


            document.getElementById(
                "sectionName"
            ).value = "";


            document.getElementById(
                "pdfFile"
            ).value = "";


            document.getElementById(
                "pdfPreview"
            ).style.display = "none";


            loadSections();

            goHome();

        };


        transaction.onerror = function(){

            alert(
                "PDF சேமிக்க முடியவில்லை."
            );

        };

    }catch(error){

        console.error(error);

        alert(
            "Browser storage-ல் பிரச்சனை ஏற்பட்டுள்ளது."
        );

    }

}


/* =====================================================
   LOAD SAVED SECTIONS
   ===================================================== */

async function loadSections(){

    const container =
        document.getElementById(
            "sectionsList"
        );


    try{

        const db =
            await openDatabase();


        const transaction =
            db.transaction(
                STORE_NAME,
                "readonly"
            );


        const store =
            transaction.objectStore(STORE_NAME);


        const request =
            store.getAll();


        request.onsuccess = function(){

            const sections =
                request.result;


            container.innerHTML = "";


            /* FIRST SECTION */

            const first =
                document.createElement("div");

            first.className =
                "section-card";

            first.onclick =
                openFirstPDF;


            first.innerHTML = `

                <div class="pdf-icon">
                    📄
                </div>

                <div class="section-info">

                    <div class="section-name">
                        முதல் இரண்டு பக்கங்கள்
                    </div>

                    <div class="section-type">
                        PDF • 2 பக்கங்கள்
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            `;


            container.appendChild(first);


            /* SAVED SECTIONS */

            sections.forEach(function(section){

                const card =
                    document.createElement("div");


                card.className =
                    "section-card";


                card.onclick = function(){

                    openSavedPDF(section.id);

                };


                card.innerHTML = `

                    <div class="pdf-icon">
                        📄
                    </div>

                    <div class="section-info">

                        <div class="section-name">
                            ${escapeHTML(section.name)}
                        </div>

                        <div class="section-type">
                            PDF
                        </div>

                    </div>

                    <div class="arrow">
                        ›
                    </div>

                `;


                container.appendChild(card);

            });


            document.getElementById(
                "emptyMessage"
            ).style.display =
                sections.length === 0
                    ? "none"
                    : "none";

        };

    }catch(error){

        console.error(error);

    }

}


/* =====================================================
   OPEN FIRST PDF
   ===================================================== */

function openFirstPDF(){

    /*
       உங்கள் முதல் PDF-ஐ upload செய்த பிறகு
       அது browser storage-ல் இருக்கும்.

       First PDF இல்லையெனில் upload page காட்டப்படும்.
    */

    showAddPage();

    document.getElementById(
        "sectionName"
    ).value =
        "முதல் இரண்டு பக்கங்கள்";

}


/* =====================================================
   OPEN SAVED PDF
   ===================================================== */

async function openSavedPDF(id){

    try{

        const db =
            await openDatabase();


        const transaction =
            db.transaction(
                STORE_NAME,
                "readonly"
            );


        const store =
            transaction.objectStore(STORE_NAME);


        const request =
            store.get(id);


        request.onsuccess = function(){

            const section =
                request.result;


            if(!section){

                alert(
                    "இந்த PDF கிடைக்கவில்லை."
                );

                return;
            }


            const url =
                URL.createObjectURL(
                    section.file
                );


            document.getElementById(
                "viewerTitle"
            ).textContent =
                section.name;


            document.getElementById(
                "pdfViewer"
            ).src = url;


            document.getElementById(
                "homePage"
            ).classList.add("hidden");


            document.getElementById(
                "addPage"
            ).classList.add("hidden");


            document.getElementById(
                "viewerPage"
            ).classList.remove("hidden");


            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };

    }catch(error){

        console.error(error);

        alert(
            "PDF-ஐ திறக்க முடியவில்லை."
        );

    }

}


/* =====================================================
   PREVIEW PDF BEFORE SAVE
   ===================================================== */

function previewPDF(){

    const input =
        document.getElementById(
            "pdfFile"
        );


    const file =
        input.files[0];


    if(!file){

        return;
    }


    if(
        file.type !== "application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")
    ){

        alert(
            "PDF file மட்டும் தேர்வு செய்யுங்கள்."
        );

        input.value = "";

        return;
    }


    const url =
        URL.createObjectURL(file);


    document.getElementById(
        "previewFrame"
    ).src = url;


    document.getElementById(
        "pdfPreview"
    ).style.display =
        "block";

}


/* =====================================================
   SHOW ADD PAGE
   ===================================================== */

function showAddPage(){

    document.getElementById(
        "homePage"
    ).classList.add("hidden");


    document.getElementById(
        "viewerPage"
    ).classList.add("hidden");


    document.getElementById(
        "addPage"
    ).classList.remove("hidden");


    window.scrollTo({
        top:0,
        behavior:"smooth
